[project]
name = "tgmonitor"
version = "1.4.0"
description = "Telegram 频道监听桌面应用 — UI 与 core 分离,监听/保存/导出 三大组件边界清晰"
readme = "README.md"
requires-python = "~=3.13.0"
license = { text = "MIT" }
authors = [{ name = "forcetone" }]

dependencies = [
    # UI
    "PySide6>=6.6",
    "qasync>=0.27",
    # Telegram 官方 (底层 TDLib,自编译 libtdjson 的 ctypes 绑定)
    "tdlib-json-client>=0.1.0",
    # 配置
    "pydantic-settings>=2.2",
    # 导出
    "Jinja2>=3.1",
    "platformdirs>=4.11.0",
]

[project.optional-dependencies]
# 选择性安装:实际用哪个 DB 就装哪个(或都装)
postgres = ["asyncpg>=0.29"]
mongo = ["motor>=3.4"]
# 对象存储 (S3 协议: AWS S3 / MinIO / 阿里 OSS)
objectstore = ["aioboto3>=13.0"]
# 一键全装
all = [
    "tgmonitor[postgres,mongo,objectstore]",
]

[project.urls]
# GitHub 仓库位置 — `pip show tgmonitor` 可见;PyPI 上传后 README 顶部 / 包页也可读
Homepage = "https://github.com/nemo1991/telegram-channel-monitor"
Repository = "https://github.com/nemo1991/telegram-channel-monitor"
Issues = "https://github.com/nemo1991/telegram-channel-monitor/issues"
Documentation = "https://github.com/nemo1991/telegram-channel-monitor/blob/main/docs/ARCHITECTURE.md"

[project.scripts]
tgmonitor = "tgmonitor.__main__:main"

# uv workspace:tdlib-json-client 是仓库内子项目(packages/tdlib_json)
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
tdlib-json-client = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgmonitor"]
# 默认 hatchling wheel 只装 .py 文件。`importlib.resources.files(...).read_bytes()`
# 跑 wheel install 时需要 SVG / QSS 跟 binary 一起 ship,否则 UI 启动 FileNotFoundError。
# 显式 include 3 类资源:顶层 SVG、icons 子目录、UI QSS。
include = [
    "src/tgmonitor/resources/*.svg",
    "src/tgmonitor/resources/icons/*.svg",
    "src/tgmonitor/ui/resources/*.qss",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# 备份的 aiotdlib 参考源码不参与 lint
extend-exclude = ["packages/tdlib_json/_vendor_ref"]

[tool.ruff.format]
# 2026-08-29 v1.5.0 PR #A1:加 format 配置 — 与 ruff check 平行门控,
# 杜绝"CI 红 → 改一行空格 → 再 CI"循环。quote-style / line-ending 与
# 既有用法保持一致(已 97 文件一次性 reformat 落地,见 38a657a)。
quote-style = "double"
line-ending = "lf"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "ASYNC"]
ignore = [
    "E501",   # line length
    "UP042",  # str + Enum is fine for pydantic-settings / json roundtrip
    "UP035",  # typing.AsyncIterator is clearer for older readers
    "SIM105", # contextlib.suppress is less obvious
    "N818",   # exception naming — we use domain names
    "B008",   # default-arg call sites in Qt widgets
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 2026-08-31 v1.5.0 PR #A7:`-m 'not integration'` 默认 skip 集成测试 —
# 显式 `uv run pytest -m integration` 才跑。CI integration job 自动加 marker 覆盖。
addopts = "-ra -q -m 'not integration'"
markers = [
    "integration: requires Docker (testcontainers) or in-process mongomock_motor;off by default",
]

[tool.coverage.run]
# 仓库内 Python 源码;branch on 看分支覆盖率
source = ["src/tgmonitor"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mypy]
# 2026-08-03 配置 — 让 tdlib_json type 绑定可验证
# 严格度有意放低:pyright-like 全开会扫到几百个 pydantic / Qt / 测试 fixture 噪声,
# 本项目以 ruff lint 为主,mypy 仅用于「tdlib_json 类型绑定完整性」这件事。
python_version = "3.13"
ignore_missing_imports = false   # 默认严格,显式 override 列外
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false    # 允许未标注函数(很多 helper 是动态的)
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
warn_return_any = false

[[tool.mypy.overrides]]
# 没 .pyi 或 runtime 不影响业务逻辑的依赖 — 全视为 Any
module = [
    "tdlib_json", "tdlib_json.*",     # 自编译 libtdjson 的 ctypes 绑定
    "platformdirs",                # user_data_dir helper
    "pydantic", "pydantic.*",      # pydantic v2 model 字段
    "pydantic_settings",           # .env 加载
    "PySide6", "PySide6.*",         # Qt6 绑定:有 stub 但 mypy 选错版本会报 import-not-found
    "qasync",                      # asyncio ↔ Qt 事件循环桥
    "asyncpg",                     # Postgres async driver
    "motor", "motor.*",            # Mongo async driver
    "aioboto3", "aioboto3.*",       # S3 async SDK
    "botocore", "botocore.*",       # aioboto3 底层的 S3 协议栈(无 stub)
    "jinja2",                      # HTML export 模板
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=2.3.0",
    "coverage>=7.15.4",
    "pyinstaller>=6.21.0",
    "moto[s3]>=5",
    # 2026-08-29 v1.5.0 PR #A1:本地 pre-commit 钩子(可选用,CI 不依赖)
    "pre-commit>=3.7",
    # 2026-08-31 v1.5.0 PR #A7:集成测试 — testcontainers 启动真 PG 服务(
    # CI-only;本地无 Docker 跑会 skip)/ mongomock_motor in-process Mongo mock(
    # 本地 + CI 通用,aggregate pipeline 部分支持度参差,仅覆盖基础 CRUD + find_media_by_file_id)。
    "testcontainers[postgresql,mongodb]>=4.8",
    "mongomock_motor>=0.0.21",
]
