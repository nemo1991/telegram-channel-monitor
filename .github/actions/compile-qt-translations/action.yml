name: Compile Qt translations
description: >
  从 .ts 编译 .qm 到 src/tgmonitor/i18n/。必须在任何 `uv sync` 之前跑 —
  hatchling force-include 读 .qm 源文件,缺则 uv sync 整体失败。

# 抽成 composite:test / mypy / integration / build 都要先有 .qm,改一处即可。
# 前置:调用方必须已 actions/checkout(本 action 不 checkout)。

runs:
  using: composite
  steps:
    - name: Compile .ts → .qm
      shell: bash
      run: |
        # uvx 而非 uv run:后者依赖 .venv,而 .venv 正是 uv sync 建的 —— 死锁。
        # uvx 临时拉 PySide6 跑 lrelease,uv 缓存复用。lrelease 默认写 .ts 同目录。
        # windows-latest 默认 pwsh 把续行 \ 当字面参数,故显式 shell: bash。
        uvx --from PySide6 pyside6-lrelease \
          src/tgmonitor/i18n/zh_CN.ts src/tgmonitor/i18n/en_US.ts
