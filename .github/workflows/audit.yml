# 周一 pip-audit 全量供应链审计(含 dev),--strict 任何 CVE 即 fail。
# 独立 cron,不挡主 CI;在 Dependabot(09:00)开 PR 后跑作为 baseline。

name: supply-chain audit

on:
  schedule:
    # 周一 09:30 UTC(17:30 Asia/Shanghai)
    - cron: "30 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit (uv-managed tool)
        run: uv tool install pip-audit

      # pip-audit 不读 uv.lock,先 export 成 requirements(含 dev 全量);
      # --no-emit-project 跳过未上 PyPI 的 tgmonitor 自身。
      - name: Export uv.lock to requirements
        run: uv export --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --strict -r requirements-audit.txt
