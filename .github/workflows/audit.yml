# Supply-chain audit — 周一跑一次 pip-audit(基于 uv.lock)。
#
# 时机:在 Dependabot(09:00)开 PR 之后跑(09:30 UTC = 17:30 Asia/Shanghai,
# 留 8h 给 Dependabot 处理),作为 baseline。
# --strict:任何 CVE 都 fail;漏洞发现即在 GitHub 通知,人工评估后再发 fix。
#
# 不挡主 CI(`test` / `lint`):单独 cron workflow。

name: supply-chain audit

on:
  schedule:
    # 周一 09:30 UTC(17:30 Asia/Shanghai)
    - cron: "30 9 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install pip-audit (uv-managed tool)
        run: uv tool install pip-audit

      # pip-audit 不直接读 uv.lock(2.10 仍不支持 PEP 751 lock 解析,裸跑会
      # 误审计工具自身环境)。先 `uv export` 成 requirements.txt(含 dev 全量
      # 供应链),再喂给 pip-audit。--no-emit-project 跳过 tgmonitor 自身
      # (未上 PyPI,否则报 "Dependency not found")。
      - name: Export uv.lock to requirements
        run: uv export --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --strict -r requirements-audit.txt