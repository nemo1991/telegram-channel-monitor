name: Build packages

on:
  # 打 v* tag 走完整打包;push main 只跑 warm-cache job 预热 libtdjson
  # 编译缓存(GitHub 缓存只有默认分支写入的缓存其他 ref 才能恢复,见下)
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }}, py${{ matrix.python-version }})
    # push main 只预热缓存,不打包;打包只在 tag / 手动触发时跑
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Linux:Qt offscreen / AppImage 工具链 + libtdjson 编译依赖
      # (libtdjson 从 td/td 源码编译,需要 cmake / gperf / OpenSSL / zlib;
      # PySide6 平台插件需要 libc++ / libGL)
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libc++-dev \
            librsvg2-bin \
            file \
            cmake gperf libssl-dev zlib1g-dev build-essential
          # appimagetool 一次性下到 /usr/local/bin
          # (AppImageCommunity/AppImageKit 已迁移到 AppImage/appimagetool)
          # -k / --retry:runner 偶发自签证书与网络抖动,资产源可信故跳过校验
          curl -fkSL --retry 3 -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake gperf openssl@3
          # appimagetool 一次性下到 /usr/local/bin
          # (AppImageCommunity/AppImageKit 已迁移到 AppImage/appimagetool,
          #  旧 continuous release 链接已 404)
          # -k:runner egress 代理是自签证书,curl 校验会 60 SSL error
          # --retry:间歇性网络失败自动重试
          curl -fkSL --retry 3 -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - name: Install project + PyInstaller (via uv)
        run: |
          # PyInstaller 已在 pyproject.toml dev dep(D1 commit)
          uv sync --all-extras --group dev

      # C: 盘兜底清理:vcpkg 重活已挪 D: 盘(见 ps1 的 -WorkRoot),
      # 这里再清掉预装的大目录,避免链接期 No space left on device(C1088/LNK1180)。
      # 不动 VS 工具链 / Git / runner 自身。
      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targets = @(
            "C:\Program Files\dotnet",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\vcpkg\downloads",
            "$env:LOCALAPPDATA\Microsoft\vcpkg\archives"
          )
          foreach ($p in $targets) {
            if (Test-Path $p) {
              $size = (Get-ChildItem $p -Recurse -Force -ErrorAction SilentlyContinue |
                       Measure-Object Length -Sum -ErrorAction SilentlyContinue).Sum
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "removed $p ($([math]::Round($size / 1MB)) MB)"
            }
          }
          Get-PSDrive C | Select-Object Used, Free | Format-Table -AutoSize

      # libtdjson(TDLib JSON 接口)编译进包内
      # packages/tdlib_json/src/tdlib_json/tdlib/ — PyInstaller collect 它
      #   Linux / macOS:从 td/td 源码编译(bash)
      #   Windows:vcpkg 安装 tdlib 并拷贝产物(pwsh)
      # 产物不变则跳过编译:三平台统一缓存包内 tdlib/ 目录(脚本按
      # .tdlib-version manifest 判断)。Windows 不缓存 vcpkg binary cache:
      # runner 预装 vcpkg 每天更新,abi 哈希随之变化,缓存 2~3 天必 miss。
      # (2026-08-17 v1.0.12 教训:binary-cache 缓存恢复成功仍冷编译 ~2h)
      - name: Cache libtdjson build output (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: packages/tdlib_json/src/tdlib_json/tdlib
          key: libtdjson-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Cache libtdjson build output (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          # v2:与 v1 的 vcpkg binary cache 内容不同(改缓存产物目录),key 升级
          # 防止新旧内容混用;下次发布即可命中
          path: packages/tdlib_json/src/tdlib_json/tdlib
          key: libtdjson-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Build libtdjson (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build_libtdjson.sh

      - name: Build libtdjson (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_libtdjson.ps1

      - name: Run PyInstaller
        # `PYTHONPATH=src` 是 bash 语法;Windows runner 默认 pwsh 不认,
        # 显式切 bash(windows-latest 自带 Git Bash)
        shell: bash
        run: |
          # 用项目 venv 跑(spec 走 collect_data_files 解析 .venv 里的 tdlib-json-client)
          PYTHONPATH=src uv run pyinstaller --clean -y tgmonitor.spec

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build_appimage.sh

      - name: Zip .app (macOS, for upload)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r tgmonitor.app.zip tgmonitor.app
          ls -lh tgmonitor.app.zip

      - name: Zip onedir (Windows, for upload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\tgmonitor -DestinationPath dist\tgmonitor-windows-x64.zip
          Get-Item dist\tgmonitor-windows-x64.zip | Select-Object Name, Length

      - name: Upload .AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor-x86_64.AppImage
          path: tgmonitor-x86_64.AppImage
          if-no-files-found: error

      - name: Upload .app.zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor.app.zip
          path: dist/tgmonitor.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor-windows-x64.zip
          path: dist/tgmonitor-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # 预热 libtdjson 编译缓存(GitHub 缓存机制:不同 tag 的 run 之间不能互相
  # 恢复缓存,只有默认分支 main 写入的缓存任何 ref 都能命中)。因此在 main
  # push 上跑一个只编译、不打包的 job,把三平台产物目录写回 main scope;
  # 之后打 v* tag 发布时 build job 用同一 key 直接命中,免去每次冷编译
  # (Windows vcpkg 冷编译约 2h → 命中后仅几分钟)。
  # 注:产物目录 + .tdlib-version manifest 的跳过逻辑只依赖项目声明的
  # TDLib 版本,与 runner 预装 vcpkg 版本无关,缓存可长期稳定命中。
  warm-cache:
    name: warm-cache (${{ matrix.os }})
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 只装编译 libtdjson 所需系统依赖(Qt 运行库 / appimagetool 打包时才需要)
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake gperf libssl-dev zlib1g-dev build-essential

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake gperf openssl@3

      - name: Install project (via uv)
        run: |
          # 脚本命中缓存跳过编译时会跑 ctypes 验证,需能在 venv 里 import tdlib_json
          uv sync --all-extras --group dev

      # Windows 兜底清 C: 盘,避免 vcpkg 链接期 No space left on device
      # (与 build job 相同;不动 VS 工具链 / Git / runner 自身)
      - name: Free disk space (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $targets = @(
            "C:\Program Files\dotnet",
            "C:\Program Files\Microsoft SQL Server",
            "C:\Program Files (x86)\Microsoft SQL Server",
            "C:\vcpkg\downloads",
            "$env:LOCALAPPDATA\Microsoft\vcpkg\archives"
          )
          foreach ($p in $targets) {
            if (Test-Path $p) {
              $size = (Get-ChildItem $p -Recurse -Force -ErrorAction SilentlyContinue |
                       Measure-Object Length -Sum -ErrorAction SilentlyContinue).Sum
              Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "removed $p ($([math]::Round($size / 1MB)) MB)"
            }
          }
          Get-PSDrive C | Select-Object Used, Free | Format-Table -AutoSize

      # 缓存 key 与 build job 完全一致:main push 写入 → tag 发布精确命中
      - name: Cache libtdjson build output (Linux/macOS)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: packages/tdlib_json/src/tdlib_json/tdlib
          key: libtdjson-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Cache libtdjson build output (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: packages/tdlib_json/src/tdlib_json/tdlib
          key: libtdjson-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Build libtdjson (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/build_libtdjson.sh

      - name: Build libtdjson (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_libtdjson.ps1

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          cd artifacts
          sha256sum tgmonitor-x86_64.AppImage tgmonitor.app.zip tgmonitor-windows-x64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/tgmonitor-x86_64.AppImage
            artifacts/tgmonitor.app.zip
            artifacts/tgmonitor-windows-x64.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true