name: Build packages

# 纯 Python 后端(Telethon),无原生库编译:uv sync + PyInstaller,三平台分钟级。
# tag v* → 打包 + GitHub Release;workflow_dispatch → 手动打包(不建 Release)。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }}, py${{ matrix.python-version }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Linux:Qt offscreen 系统库 + AppImage 工具链(rsvg-convert / appimagetool)。
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 \
            librsvg2-bin \
            file
          # appimagetool 仅 Linux 用;-k/--retry:runner 自签证书 + 网络抖动。
          curl -fkSL --retry 3 -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      # .qm 必须早于 uv sync:hatchling force-include 读 .qm 源文件,缺则 sync 失败。
      - name: Compile Qt translation files (.ts → .qm)
        uses: ./.github/actions/compile-qt-translations

      - name: Install project + PyInstaller (via uv)
        run: uv sync --all-extras --group dev

      - name: Run PyInstaller
        # PYTHONPATH=src 是 bash 语法;Windows 默认 pwsh 不认,显式切 bash。
        shell: bash
        run: PYTHONPATH=src uv run pyinstaller --clean -y tgmonitor.spec

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/build_appimage.sh

      - name: Zip .app (macOS, for upload)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r tgmonitor.app.zip tgmonitor.app
          ls -lh tgmonitor.app.zip

      - name: Zip onedir (Windows, for upload)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\tgmonitor -DestinationPath dist\tgmonitor-windows-x64.zip
          Get-Item dist\tgmonitor-windows-x64.zip | Select-Object Name, Length

      - name: Upload .AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor-x86_64.AppImage
          path: tgmonitor-x86_64.AppImage
          if-no-files-found: error

      - name: Upload .app.zip
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor.app.zip
          path: dist/tgmonitor.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v5
        with:
          name: tgmonitor-windows-x64.zip
          path: dist/tgmonitor-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          cd artifacts
          sha256sum tgmonitor-x86_64.AppImage tgmonitor.app.zip tgmonitor-windows-x64.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/tgmonitor-x86_64.AppImage
            artifacts/tgmonitor.app.zip
            artifacts/tgmonitor-windows-x64.zip
            artifacts/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
