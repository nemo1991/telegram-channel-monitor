name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # Windows:测试不加载真实 libtdjson(conftest 的 stub_tdlib_init
        # fixture 拦截 TdlibJsonClient 构造),无需编译引擎即可跑通;
        # 视觉回归 golden 图是 macOS 渲染产物,Windows 上跳过(见 Run pytest)。
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # 拉源码 — shallow clone 已够(测试只读 HEAD 状态)
      - uses: actions/checkout@v5

      # 一站式装 uv + Python + 缓存驱动:`uv sync` 靠 `cache-dependency-glob`
      # 自动监控 uv.lock 变化,lock 变 → 失效;不走 actions/cache@v4,
      # 跨平台 cache path 自动(Library/Caches/uv / ~/.cache/uv / %LOCALAPPDATA%\uv)
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Ubuntu 上 Qt6 offscreen QPA 需要 libEGL / libGL / libxkbcommon / libfontconfig / libsm / libice 等
      # 缺一 import QtWidgets 就 ImportError;macOS 自带 / 已 brew 装好。
      # libc++-dev 给 libtdjson(TDLib 原生库)提供 libc++.so.1
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 \
            libc++-dev
          # Qt offscreen QPA 还需要 libegl;装完后 ldconfig
          sudo ldconfig

      # uv sync 一次性装:
      #   - [project.dependencies] (PySide6 / qasync / tdlib-json-client / pydantic-settings / Jinja2)
      #   - [project.optional-dependencies] 全部 (postgres/mongo/objectstore)
      #   - [dependency-groups].dev (pytest / pytest-asyncio / ruff / coverage)
      # `-q` 关 progress bar,CI 日志干净
      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 只加载已安装的 console_scripts entry point,不调用 `main()`。
      # `tgmonitor --help` 没有 argparse 路径,会实际启动 Qt event loop,
      # 在 macOS runner 上永久卡住;entry.load() 足够验证注册目标可导入。
      - name: Verify CLI entry
        # 脚本是 bash heredoc;Windows runner 默认 pwsh 不支持 <<'PY',
        # 显式切 bash(windows-latest 自带 Git Bash)
        shell: bash
        run: |
          uv run python - <<'PY'
          from importlib.metadata import entry_points

          matches = entry_points(group="console_scripts", name="tgmonitor")
          assert len(matches) == 1, matches
          entry = next(iter(matches))
          assert callable(entry.load())
          print(f"{entry.name} -> {entry.value}")
          PY

      - name: Run pytest
        env:
          PYTHONPATH: src
          # 强制 Qt 用 offscreen 后端(无显示器),PySide6 在 CI 必设,否则
          # Linux 上 Qt 会尝试加载 libEGL.so.1 之类系统库;
          # 单元测试里 conftest 已 setdefault,但 ENV 在进程启动前定最稳
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.warning=false"
        # 脚本用 bash 语法(set +e / while 重试),Windows runner 默认 pwsh,
        # 显式切 bash(windows-latest 自带 Git Bash)
        shell: bash
        run: |
          # -v 看每个 case 名;--tb=short 失败时压栈长度可控;
          # `uv run` 自动激活 venv(PYTHONPATH 也透传),装好的 editable 项目
          # 在 .venv 里直接可用,无需 python -m pip install -e 再来一次
          #
          # **视觉回归文件隔离 + 重试**(2026-08-05):
          # macOS-26-arm64 runner 上 `tests/test_visual_regression.py` 间歇
          # segfault(Qt/Cocoa native race,无进程内 fix)— 把这部分单独
          # 跑,失败(无论 pytest fail 还是进程 SIGSEGV)重试最多 3 次。
          # 其他 17 个测试文件**不**进重试,失败立即报错,避免 retry 掩盖
          # 真 bug。
          set +e
          uv run python -m pytest -v --tb=short \
            --ignore=tests/test_visual_regression.py
          main_rc=$?
          set -e

          # 视觉回归 retry(覆盖 segfault + 真 fail)。
          # Windows 上跳过:golden 图是 macOS 渲染产物,Windows 字体渲染
          # 差异必然漂移,跑只会稳定失败。
          visual_rc=0
          if [ "$RUNNER_OS" != "Windows" ]; then
            visual_attempt=1
            visual_rc=1
            while [ $visual_attempt -le 3 ] && [ $visual_rc -ne 0 ]; do
              echo "::group::visual-regression attempt $visual_attempt/3"
              set +e
              uv run python -m pytest tests/test_visual_regression.py -v --tb=short
              visual_rc=$?
              set -e
              echo "::endgroup::"
              if [ $visual_rc -ne 0 ]; then
                echo "visual-regression attempt $visual_attempt failed (exit $visual_rc), retrying..."
              fi
              visual_attempt=$((visual_attempt + 1))
            done
          fi

          if [ $main_rc -ne 0 ] || [ $visual_rc -ne 0 ]; then
            echo "::error::pytest main_rc=$main_rc visual_rc=$visual_rc"
            exit 1
          fi

      # 再跑一次只为收集 branch coverage + 产 xml 报告(不设阈值门控)
      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: |
          # coverage 已经在 --group dev 里装好;`uv run` 注入 PATH。
          # Windows 上视觉回归 golden 图必漂移,不参与覆盖率统计
          if [ "$RUNNER_OS" = "Windows" ]; then
            uv run coverage run -m pytest -q --ignore=tests/test_visual_regression.py
          else
            uv run coverage run -m pytest -q
          fi
          uv run coverage xml -o coverage.xml

      # 以 OS + Python 版本为名,跨矩阵下不互相覆盖;若 coverage.xml
      # 不存在(说明 pytest 失败或根本没装 coverage),warn 不 fail
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          # 以 OS + Python 版本为名,跨矩阵下不互相覆盖
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      # lint 单独 job:不走 .venv 也行,`uv tool run ruff` 直接拉 ruff 到临时 env
      # 跑 ruff,免一次完整 uv sync(只装 ruff 即可,~10MB)
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 0 容忍:任何 E/F/I/B/UP/N/SIM/ASYNC 警告都让本 job 红,见 pyproject.toml
      # [tool.ruff.lint].select 配置。`uv tool run` 临时拉 ruff(~10MB)不污染
      # 主 venv — lint 不需要 PySide6 等 700MB+ 的大包
      - name: Run ruff
        run: uv tool run --from "ruff>=0.5" ruff check src tests

  mypy:
    # 2026-08-03 新增 — 配 pyproject.toml [tool.mypy] 后跟 ruff 平行跑,
    # 守住业务模块的类型完整性。
    #
    # 范围:8 个入口 — 5 个 core 业务子包 + ui 子包 + app.py 顶层入口 +
    # **整 `src` 包全局 sanity check**(守住 `__main__.py` / `core/settings_store.py` /
    # `core/telegram/tdlib_{channels,proxy,messages}.py` 这些没在 entry 矩阵里的文件)。
    # ui/ + app.py 走 per-file `# mypy: disable-error-code="attr-defined"`
    # 屏蔽 PySide6 stub 不全噪声,留下 union-attr / var-annotated 等真错。
    # telegram 子包走 `# mypy: disable-error-code="misc,assignment"`
    # 屏蔽 tdlib_json / pydantic stub 不全噪声。
    name: mypy (${{ matrix.module }} / ${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 5 个 core 业务子包 + 1 UI 子包 + app.py 顶层入口 + 整 src 全局 sanity check。
        # 历史:`core/telegram/` 首发(tdlib_json stub 完整性,35 → 0 ignores 守住),
        # 2026-08-04 加 ui/ + app.py(per-file attr-defined 关掉,107 → 0 错),
        # 加 `src` 整包守住 `settings_store.py` + `tdlib_channels.py` +
        # `tdlib_proxy.py` + `tdlib_messages.py`(71 → 0 错)。
        module: [
          "src/tgmonitor/core/monitor",
          "src/tgmonitor/core/storage",
          "src/tgmonitor/core/export",
          "src/tgmonitor/core/objectstore",
          "src/tgmonitor/core/telegram",
          "src/tgmonitor/ui",
          "src/tgmonitor/app.py",
          "src",
        ]
        python-version: ["3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 装 dev + extras 让 tdlib_json / pydantic / platformdirs / pydantic_settings
      # 全可 import,否则 mypy 报 missing-imports(已被 [tool.mypy.overrides]
      # 屏蔽但 warning 仍多,污染日志)
      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      - name: Run mypy
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          # 严格要求 0 error;无 `|| true` 兜底
          uv run mypy ${{ matrix.module }}
