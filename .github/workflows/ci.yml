name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # 全离线:Telegram 走 FakeTelegramClient / Telethon mock,无需引擎或凭据。
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Qt6 offscreen QPA 的系统库;libpulse0 给 QtMultimedia(QMediaPlayer)。macOS 自带。
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libpulse0
          sudo ldconfig

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 只 load entry point,不调 main():避免任何入口在 runner 上意外启动 GUI。
      # 2.1.2:两个入口 tgmon(GUI) / tgmon-cli(CLI),旧的 tgmonitor 已移除。
      - name: Verify CLI entry
        shell: bash
        run: |
          uv run python - <<'PY'
          from importlib.metadata import entry_points

          scripts = {ep.name: ep for ep in entry_points(group="console_scripts")}
          for name, expected in (
              ("tgmon", "tgmonitor.__main__:main"),
              ("tgmon-cli", "tgmonitor.cli.main:main_tgmon_cli"),
          ):
              entry = scripts.get(name)
              assert entry is not None, f"missing console script: {name}"
              assert entry.value == expected, (name, entry.value)
              assert callable(entry.load())
              print(f"{entry.name} -> {entry.value}")
          assert "tgmonitor" not in scripts, "tgmonitor 命令应在 2.1.2 移除"
          PY

      # 三平台统一裸 pytest,覆盖率交给下方独立的 coverage job(仅 ubuntu)。
      # 2026-11-12:coverage 插桩在 runner 上多次引发无限 hang —— Windows 的
      # ProactorEventLoop + asyncio.to_thread 稳定卡在 test_media_downloader.py
      # 第 8 个用例;pyproject.toml 也记着 10-03 / 10-22 ubuntu 卡 32 分钟、
      # macOS 卡 40 分钟,两次都只能手动 cancel。插桩只留在观测 job,
      # 平台门控一律裸跑,测试集合与参数三平台完全一致。
      - name: Run pytest
        env:
          PYTHONPATH: src
          # Windows 用原生 windows 插件:offscreen 在 windows-latest 下
          # processEvents() 会 access violation(issue #20)。
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: uv run python -m pytest -v --tb=short

  coverage:
    # 覆盖率在 ubuntu 单独收一份(三平台各收一份只是重复);独立 job 把插桩与
    # 平台门控隔离,能单独重跑。
    #
    # 2026-11-26 2.1.7 起是**门禁**(`--fail-under=70`),不再是纯观测:此前
    # `continue-on-error` + 无阈值,覆盖率从多高掉到多低都不会让任何 PR 变红。
    # 阈值取 CI 实测(行 74.28% / 分支 57.08% / 合计 71.18%)下方约 1 个点的
    # 余量 —— 只拦「断崖式下跌」,不逼人为数字写无意义测试;建议只升不降。
    #
    # 旧注释记录的 hang 风险仍适用于本 job,但 2026-10-22 起 pytest-timeout
    # (300s / thread)已把无期限 hang 变成一次带全线程栈的**指名失败**,
    # 这正是想要的行为:失败会阻塞合并并留下现场,而不是被 continue-on-error
    # 吞掉。若它连续失败需单独排查,不要直接恢复平台内插桩或去掉阈值。
    name: coverage (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 与 test job 的 ubuntu 前置保持一致(Qt offscreen 系统库)。
      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libpulse0
          sudo ldconfig

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: |
          uv run coverage run -m pytest -v --tb=short
          uv run coverage xml -o coverage.xml
          # 阈值依据见 job 头注释;`coverage report` 在阈值未达时退出码 2 → job 红。
          uv run coverage report --fail-under=70

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-ubuntu-py3.13
          path: coverage.xml
          if-no-files-found: error

  plugin-contract:
    # 插件守护单独成 job：全套 pytest 当然也包含这些用例，但混在 1300+ 用例里，
    # 一旦测试文件被误删/改名、或某个守护被 skip，全套仍可能全绿。独立 job 用
    # junit 断言「关键守护确实跑过」，让活文档 / 表面 allowlist / 失败回滚这些
    # 不变量变成可单独重跑、且失败一眼可见的门禁。
    # 新增 `tests/test_plugin*.py` 会被 glob 自动纳入，不需要登记。
    name: plugin contract (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 管理页 / UI 注入用例需要 Qt offscreen 系统库，与 coverage job 同前置。
      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libpulse0
          sudo ldconfig

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      - name: Run plugin contract tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: |
          uv run pytest -v --tb=short --junitxml=junit-plugin-contract.xml \
            tests/test_plugin*.py \
            tests/test_app_service_surface.py \
            tests/test_architecture.py \
            tests/test_cli.py

      # 与 integration job 同款防空转：pytest 的 skip 不影响退出码，文件被删也可能
      # 只跑剩下几个用例照样绿。这里逐条点名关键守护，必须真实执行且零 skip。
      - name: Assert plugin guards actually ran
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("junit-plugin-contract.xml").getroot()
          cases = root.findall(".//testcase")
          skipped = [c for c in cases if c.find("skipped") is not None]
          failures = [
              c for c in cases
              if c.find("failure") is not None or c.find("error") is not None
          ]
          required = (
              "test_example_discovers_and_activates",
              "test_example_plugin_top_level_imports_no_qt",
              "test_ui_getter_failure_marks_failed_without_exporter_residue",
              "test_plugin_api_methods_allowlist",
              "test_plugin_context_fields_allowlist",
              "test_plugins_does_not_import_qt_or_qasync",
              "test_cli_does_not_import_qt_or_qasync",
              "test_public_methods_allowlist",
          )
          names = [c.get("name", "") for c in cases]
          missing = [n for n in required if not any(name.startswith(n) for name in names)]
          print(
              f"plugin contract: {len(cases)} cases, "
              f"{len(skipped)} skipped, {len(failures)} failed"
          )
          assert cases, "junit 里一个用例都没有 —— plugin-contract job 空转"
          assert not failures, f"{len(failures)} 个用例失败 / 出错"
          assert not skipped, "有插件守护被 skip:\n" + "\n".join(
              f"  {c.get('classname')}::{c.get('name')}" for c in skipped
          )
          assert not missing, "关键守护用例缺失（测试文件被删/改名?）:\n" + "\n".join(
              f"  {n}" for n in missing
          )
          PY

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-plugin-contract
          path: junit-plugin-contract.xml
          if-no-files-found: ignore

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # uv.lock 是 ruff 版本的单一真源。此前 `--from "ruff>=0.5"` 每次 CI 都临时拉
      # **最新** ruff,而本地 / pre-commit 用锁定版 —— 上游一发新版(新增规则、
      # 改 format 口径)就会在没人改代码的情况下让 CI 变红,本地却复现不了。
      # 仍走 `uv tool run`(免完整 uv sync 装 PySide6 等大包),只是版本钉到锁定值。
      - name: Resolve locked ruff version
        id: ruff
        shell: bash
        run: echo "version=$(grep -A1 '^name = "ruff"$' uv.lock | grep '^version' | head -1 | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Show ruff version
        run: echo "locked ruff=${{ steps.ruff.outputs.version }}"

      # lock 与 pyproject 脱节(改了依赖没 `uv lock`)时直接失败,不等运行期才发现。
      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Run ruff check
        run: uv tool run --from "ruff==${{ steps.ruff.outputs.version }}" ruff check src tests

      - name: Run ruff format check
        run: uv tool run --from "ruff==${{ steps.ruff.outputs.version }}" ruff format --check src tests

  mypy:
    name: mypy (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 整包一次跑完(原 8 模块 × 2 OS 矩阵已收敛);0 error 门控。
      - name: Run mypy
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: uv run mypy src/tgmonitor

  integration:
    # 真 PG 集成(testcontainers[postgres]);仅 ubuntu(Docker 兼容性最佳)。
    name: integration (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Docker 已预装;Qt offscreen 系统库同 test job。
      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libglib2.0-0t64 libsm6 libice6 libpulse0

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 覆盖 addopts 的 -m 'not integration',显式跑集成测试。
      - name: Run integration tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m integration -v --junitxml=junit-integration.xml

      # 门禁:`pg_engine` 在无 Docker 时 `pytest.skip`(本地开发的善意兜底),而 skip
      # 不影响 pytest 退出码 —— 此前 Docker 没起来 / 镜像拉不到 / 容器启动超时,
      # integration job 照样**全绿**,整条真 PG 验证静默消失。2026-11-26 2.1.7 起
      # parse junit 断言:零 skip、用例数非零、且三后端 parametrize 的 `pg` 项实跑过
      # (防止 fixture 参数被悄悄去掉后本 job 退化成只跑旧用例)。
      - name: Assert integration tests actually ran
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("junit-integration.xml").getroot()
          cases = root.findall(".//testcase")
          skipped = [c for c in cases if c.find("skipped") is not None]
          errors = [c for c in cases if c.find("error") is not None or c.find("failure") is not None]
          pg_cases = [c for c in cases if "[pg" in c.get("name", "")]
          print(f"integration: {len(cases)} cases, {len(pg_cases)} pg-parametrized, {len(skipped)} skipped")
          assert cases, "junit 里一个用例都没有 —— integration job 空转"
          assert not errors, f"{len(errors)} 个用例失败 / 出错"
          assert not skipped, "有集成测试被 skip(CI runner 上应有 Docker):\n" + "\n".join(
              f"  {c.get('classname')}::{c.get('name')}: "
              f"{(c.find('skipped').get('message') or '')[:120]}" for c in skipped
          )
          assert pg_cases, "没有任何 `[pg]` 参数化用例 —— 三后端 parametrize 丢了"
          PY

      - name: Upload junit artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-integration
          path: junit-integration.xml
          if-no-files-found: ignore
