name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        # 全离线:Telegram 走 FakeTelegramClient / Telethon mock,无需引擎或凭据。
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Qt6 offscreen QPA 的系统库;libpulse0 给 QtMultimedia(QMediaPlayer)。macOS 自带。
      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libpulse0
          sudo ldconfig

      # .qm 必须早于 uv sync:hatchling force-include 读 .qm 源文件,缺则 sync 失败。
      - name: Compile Qt translation files (.ts → .qm)
        uses: ./.github/actions/compile-qt-translations

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 只 load entry point,不调 main():--help 会启动 Qt loop,在 macOS runner 卡死。
      - name: Verify CLI entry
        shell: bash
        run: |
          uv run python - <<'PY'
          from importlib.metadata import entry_points

          matches = entry_points(group="console_scripts", name="tgmonitor")
          assert len(matches) == 1, matches
          entry = next(iter(matches))
          assert callable(entry.load())
          print(f"{entry.name} -> {entry.value}")
          PY

      # 三平台统一裸 pytest,覆盖率交给下方独立的 coverage job(仅 ubuntu)。
      # 2026-11-12:coverage 插桩在 runner 上多次引发无限 hang —— Windows 的
      # ProactorEventLoop + asyncio.to_thread 稳定卡在 test_media_downloader.py
      # 第 8 个用例;pyproject.toml 也记着 10-03 / 10-22 ubuntu 卡 32 分钟、
      # macOS 卡 40 分钟,两次都只能手动 cancel。插桩只留在观测 job,
      # 平台门控一律裸跑,测试集合与参数三平台完全一致。
      - name: Run pytest
        env:
          PYTHONPATH: src
          # Windows 用原生 windows 插件:offscreen 在 windows-latest 下
          # processEvents() 会 access violation(issue #20)。
          QT_QPA_PLATFORM: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: uv run python -m pytest -v --tb=short

  coverage:
    # 覆盖率是纯观测指标(不设阈值、暂无 codecov),同一份代码三平台各收一份
    # 只是重复;单独在 ubuntu 收一份即可。独立 job 还把插桩的 hang 风险与
    # 平台门控隔离:即使该 job 超时或挂起,也不会让 push / PR 的测试门控变红,
    # 且能单独重跑。若它连续失败需单独排查,不要直接恢复平台内插桩。
    name: coverage (ubuntu, py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 与 test job 的 ubuntu 前置保持一致(Qt offscreen 系统库)。
      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libxcb-icccm4 libxcb-image0 libxcb-util1 \
            libsm6 libice6 libpulse0
          sudo ldconfig

      - name: Compile Qt translation files (.ts → .qm)
        uses: ./.github/actions/compile-qt-translations

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      - name: Run pytest with coverage
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          QT_LOGGING_RULES: "*.warning=false"
        shell: bash
        run: |
          uv run coverage run -m pytest -v --tb=short
          uv run coverage xml -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-ubuntu-py3.13
          path: coverage.xml
          if-no-files-found: warn

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # uv tool run 临时拉 ruff,免完整 uv sync(不装 PySide6 等大包)。0 容忍门控。
      - name: Run ruff check
        run: uv tool run --from "ruff>=0.5" ruff check src tests

      - name: Run ruff format check
        run: uv tool run --from "ruff>=0.5" ruff format --check src tests

  mypy:
    name: mypy (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Compile Qt translation files (.ts → .qm)
        uses: ./.github/actions/compile-qt-translations

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 整包一次跑完(原 8 模块 × 2 OS 矩阵已收敛);0 error 门控。
      - name: Run mypy
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: uv run mypy src/tgmonitor

  integration:
    # 真 PG 集成(testcontainers[postgres]);仅 ubuntu(Docker 兼容性最佳)。
    name: integration (ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # Docker 已预装;Qt offscreen 系统库同 test job。
      - name: Install system dependencies (Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0 \
            libxcb-randr0 libxcb-render-util0 libxcb-render0 \
            libglib2.0-0t64 libsm6 libice6 libpulse0

      - name: Compile Qt translation files (.ts → .qm)
        uses: ./.github/actions/compile-qt-translations

      - name: Install dependencies
        run: uv sync --all-extras --group dev -q

      # 覆盖 addopts 的 -m 'not integration',显式跑集成测试。
      - name: Run integration tests
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m integration -v
