# Dependabot 周扫:uv 生态(读 pyproject + uv.lock)+ GitHub Actions。
# 不自动合并,人工 review;单包一 PR,粒度细。

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # Actions 单独周扫,避免 setup-uv / checkout 落后 major。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
