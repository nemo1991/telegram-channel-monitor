# 2026-08-29 v1.5.0 PR #A1:本地 pre-commit 钩子配置
#
# 启用方法(本地开发,CI 不依赖):
#   uv sync --all-extras --group dev
#   uv run pre-commit install
#   # 手动跑一次(可选):
#   uv run pre-commit run --all-files
#
# 钩子清单:
#   - pre-commit-hooks:通用 hygiene(trailing-whitespace / end-of-file / yaml / toml / merge-conflict)
#   - ruff:lint(与 CI ruff check 一致)+ format(与 CI ruff format --check 一致)
#   - gitleaks:机密扫描(防止 TG_API_ID / TG_API_HASH / session 文件误 commit)
#
# CI 兜底:即便本地没装 pre-commit,CI 的 ruff check + format --check
# 步骤也会拦下同一类问题。两层防护。
#
# 安装 pre-commit 后,首次 commit 会跑全栈(~10s),后续 commit 只跑
# 改动的文件(~1s)。`pre-commit.ci` 也可对接 GitHub PR,但本仓库默认
# 不开 — 避免与本地钩子双跑浪费 CI 配额。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Markdown 末尾两个空格 = 强制换行符,保留
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # tgmonitor.spec 内嵌长 docstring 不算大文件,阈值 500KB
        args: [--maxkb=500]

  # ruff 不写死版本:用 local hook 走 `uv run --frozen`,每次从 uv.lock 解析版本,
  # 与 CI 的 ruff job（`uv.lock` 同一版本）天然一致 —— 升级 ruff 只需更新 uv.lock。
  # pre-commit 的 `rev` 是静态字符串,无法引用 lock 文件,故不再用 ruff-pre-commit 仓库;
  # 附带好处:不联网克隆钩子仓库。前提:`uv` 在 PATH 中(项目本身就用 uv 管理)。
  - repo: local
    hooks:
      # 与 CI `ruff check src tests` 一致(读 pyproject.toml [tool.ruff.lint])
      - id: ruff
        name: ruff check (uv.lock)
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      # 与 CI `ruff format --check src tests` 一致(读 pyproject.toml [tool.ruff.format])
      - id: ruff-format
        name: ruff format (uv.lock)
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      # 主动扫描 commit 内容,拦截 TG_API_ID / TG_API_HASH / session 文件等敏感
      # 字符串,见 CONTRIBUTING.md「🔐 安全」段。注意:CI 侧目前**没有**密钥扫描
      # (只有 audit.yml 的每周 pip-audit),本钩子是唯一的自动化拦截点。
      - id: gitleaks