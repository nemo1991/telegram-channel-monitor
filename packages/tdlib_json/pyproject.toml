[project]
name = "tdlib-json-client"
version = "0.1.0"
description = "TDLib JSON 客户端 — 自编译 libtdjson 的 ctypes 绑定,替代已归档的 aiotdlib"
requires-python = "~=3.13.0"
license = { text = "MIT" }
authors = [{ name = "forcetone" }]

# 零运行时依赖 — 纯标准库(ctypes + json + asyncio)
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tdlib_json"]
# 默认只收集 .py;`tdlib/` 下的 libtdjson 动态库由 scripts/build_libtdjson.sh
# 产出且被 .gitignore 排除,必须显式 include 才能进 wheel(否则打包丢失)。
include = ["src/tdlib_json/tdlib/**"]
